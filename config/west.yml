manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: sayu-hub
      url-base: https://github.com/sayu-hub
  projects:
    - name: zmk
      remote: zmkfirmware
      # Pinned before two breaking changes for this config:
      # 1. 2025-11-14 (zmkfirmware/zmk@5138c6fb): zmk_keymap_layer_activate()
      #    gained a `locking` param, which sayu-hub/zmk-pmw3610-driver (frozen
      #    since 2025-02) doesn't pass, so it fails to compile.
      # 2. 2025-12-09 (zmkfirmware/zmk@c06fa48c): move to Zephyr 4.1, which
      #    renamed boards (e.g. seeeduino_xiao_ble) and added a native
      #    PMW3610 driver that conflicts with zmk-pmw3610-driver's devicetree
      #    binding. See https://zmk.dev/blog/2025/12/09/zephyr-4-1
      # Bump this once zmk-pmw3610-driver is updated (or the trackball config
      # is migrated to the native driver).
      revision: f9be3ed94301eaa5b9cf1bd63779cecc2c8b430e
      import: app/west.yml
    - name: zmk-pmw3610-driver
      remote: sayu-hub
      revision: main
  self:
    path: config
